.dark{fill:#243B53}.txt{font:15px Arial;fill:#243B53}.small{font:13px Arial;fill:#52657A}
.arrow{stroke:#607D9B;stroke-width:2.2;fill:none;marker-end:url(#arr)}
</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607D9B"/></marker></defs><rect width="1000" height="700" rx="18" fill="#fff"/><rect width="1000" height="10" fill="#245B8F"/><text x="42" y="58" class="title">Attendance Cleaner — Flowchart</text><text x="42" y="86" class="sub">Clean, deduplicate, sort and export student attendance records</text><rect x="370" y="105" width="260" height="52" rx="12" class="green"/><text x="500.0" y="136.0" text-anchor="middle" class="txt">Start</text><path d="M500,157 L500,185" class="arrow"/><rect x="370" y="185" width="260" height="58" rx="12" class="box"/><text x="500.0" y="219.0" text-anchor="middle" class="txt">Read attendance.txt</text><path d="M500,243 L500,270" class="arrow"/><rect x="370" y="270" width="260" height="58" rx="12" class="box"/><text x="500.0" y="294.0" text-anchor="middle" class="txt">Strip whitespace</text><text x="500.0" y="315.0" text-anchor="middle" class="txt">from each line</text><path d="M500,328 L500,355" class="arrow"/><rect x="370" y="355" width="260" height="65" rx="12" class="purple"/><text x="500.0" y="382.5" text-anchor="middle" class="txt">Build cleaned list</text><text x="500.0" y="403.5" text-anchor="middle" class="txt">using list comprehension</text><path d="M500,420 L500,447" class="arrow"/><rect x="370" y="447" width="260" height="58" rx="12" class="green"/><text x="500.0" y="471.0" text-anchor="middle" class="txt">Remove duplicates</text><text x="500.0" y="492.0" text-anchor="middle" class="txt">using set()</text><path d="M500,505 L500,532" class="arrow"/><rect x="370" y="532" width="260" height="58" rx="12" class="box"/><text x="500.0" y="556.0" text-anchor="middle" class="txt">Sort names</text><text x="500.0" y="577.0" text-anchor="middle" class="txt">alphabetically</text><path d="M500,590 L500,615" class="arrow"/><rect x="370" y="615" width="260" height="48" rx="12" class="orange"/><text x="500.0" y="644.0" 