<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><style>
.title{font:700 27px Arial;fill:#172B4D}.sub{font:14px Arial;fill:#607089}
.box{fill:#F3F7FC;stroke:#3973B9;stroke-width:2}.green{fill:#EAF7F0;stroke:#29966A;stroke-width:2}
.orange{fill:#FFF3E5;stroke:#D58B35;stroke-width:2}.purple{fill:#F2EDFC;stroke:#8064B5;stroke-width:2}
.dark{fill:#243B53}.txt{font:15px Arial;fill:#243B53}.small{font:13px Arial;fill:#52657A}
.arrow{stroke:#607D9B;stroke-width:2.2;fill:none;marker-end:url(#arr)}
</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607D9B"/></marker></defs><rect width="1000" height="700" rx="18" fill="#fff"/><rect width="1000" height="10" fill="#245B8F"/><text x="42" y="58" class="title">Expense Tracker — Flowchart</text><text x="42" y="86" class="sub">Menu-driven CSV expense manager with input validation and category summaries</text><rect x="370" y="115" width="260" height="55" rx="12" class="green"/><text x="500.0" y="147.5" text-anchor="middle" class="txt">Start</text><path d="M500,170 L500,205" class="arrow"/><rect x="370" y="205" width="260" height="60" rx="12" class="box"/><text x="500.0" y="230.0" text-anchor="middle" class="txt">Load expenses.csv</text><text x="500.0" y="251.0" text-anchor="middle" class="txt">or create empty list</text><path d="M500,265 L500,300" class="arrow"/><rect x="370" y="300" width="260" height="60" rx="12" class="box"/><text x="500.0" y="335.0" text-anchor="middle" class="txt">Display main menu</text><path d="M500,360 L500,395" class="arrow"/><rect x="370" y="395" width="260" height="60" rx="12" class="purple"/><text x="500.0" y="430.0" text-anchor="middle" class="txt">Select menu option</text><path d="M370,425 L220,425" class="arrow"/><text x="302.0" y="418.0" class="small">Add expense</text><rect x="45" y="395" width="175" height="60" rx="12" class="box"/><text x="132.5" y="420.0" text-anchor="middle" class="txt">Enter date, category</text><text x="132.5" y="441.0" text-anchor="middle" class="txt">and amount</text><path d="M132,455 L132,500" class="arrow"/><rect x="45" y="500" width="175" height="60" rx="12" class="orange"/><text x="132.5" y="535.0" text-anchor="middle" class="txt">Validate amount</text><path d="M220,530 L310,530" class="arrow"/><text x="272.0" y="523.0" class="small">Valid</text><rect x="310" y="500" width="175" height="60" rx="12" class="green"/><text x="397.5" y="535.0" text-anchor="middle" class="txt">Add to expense list</text><path d="M485,530 L570,530" class="arrow"/><rect x="570" y="500" width="175" height="60" rx="12" class="green"/><text x="657.5" y="535.0" text-anchor="middle" class="txt">Save CSV file</text><path d="M630,395 L820,395" class="arrow"/><text x="732.0" y="388.0" class="small">View summary</text><rect x="770" y="425" width="190" height="65" rx="12" class="purple"/><text x="865.0" y="452.5" text-anchor="middle" class="txt">Calculate category</text><text x="865.0" y="473.5" text-anchor="middle" class="txt">totals</text><path d="M865,490 L865,535" class="arrow"/><rect x="770" y="535" width="190" height="55" rx="12" class="purple"/><text x="865.0" y="567.5" text-anchor="middle" class="txt">Display report</text><path d="M500,455 L500,610" class="arrow"/><text x="507.0" y="525.5" class="small">Exit</text><rect x="420" y="610" width="160" height="38" rx="12" class="dark"/><text x="500.0" y="634.0" text-anchor="middle" class="txt">End</text><text x="42" y="678" class="small">Assessment 4 • Personal Finance &amp; Student Attendance Management System</text></svg>